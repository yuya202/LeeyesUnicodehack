name: Build Leeyes Unicode Hack - Archive Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - diagnose-archive-empty-listing-v8-ntdll-loader

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnose-archive-empty-listing-v8-ntdll-loader

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Prepare output directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'Leeyes' | Out-Null
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null

      - name: Build solution (Release Win32)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CL = '/wd4996 /DUNICODEHACK_PLUGIN_DEBUG=1'
          msbuild '.\LeeyesHook.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Assemble and verify diagnostic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('.\Leeyes\inject_dll.dll', '.\Leeyes\LeeyesDiagLauncher.exe')
          foreach ($file in $required) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Required build output not found: $file"
              }
          }

          Copy-Item -LiteralPath '.\inject_dll.ini' -Destination '.\Leeyes\inject_dll.ini' -Force
          Add-Content -LiteralPath '.\Leeyes\inject_dll.ini' -Value "`n[Debug]`nDebugLog=1" -Encoding ascii

          foreach ($file in @('.\Leeyes\inject_dll.dll', '.\Leeyes\LeeyesDiagLauncher.exe')) {
              $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $file))
              if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                  throw "Not a valid PE/MZ file: $file"
              }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
                  $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                  $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
                  throw "Invalid PE header: $file"
              }
              $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
              if ($machine -ne 0x014c) {
                  throw "Expected 32-bit x86 PE (0x014c), got 0x$('{0:X4}' -f $machine): $file"
              }
          }

          $ini = Get-Content -LiteralPath '.\Leeyes\inject_dll.ini' -Raw
          foreach ($setting in @('HookFindFirstFile=1', 'HookSetWindowText=1', 'HookTextDrawing=1')) {
              if ($ini -notmatch [regex]::Escape($setting)) {
                  throw "Expected setting missing from inject_dll.ini: $setting"
              }
          }

          @(
              'Leeyes Unicode Hack - GitHub Actions build'
              "Repository commit: $env:GITHUB_SHA"
              "Built at (UTC): $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))"
              'Configuration: Release | Win32 (x86) | Archive diagnostics enabled'
              'Diagnostic build: launcher waits for the initial Windows debugger breakpoint, resolves loader functions from ntdll.dll, calls LdrLoadDll and LdrGetProcedureAddress in the target process, initializes hooks before the Leeyes EXE entry point, and records NTSTATUS values.'
              'The launcher uses ntdll.dll loader APIs at the initial Windows system breakpoint, before the Leeyes EXE entry point.'
              'LeeyesW.exe is not included or used.'
              'Included: inject_dll.dll, LeeyesDiagLauncher.exe, inject_dll.ini, test instructions, build info, and hashes.'
              'Overlay package: extract all ZIP contents directly into the existing Leeyes folder that contains Leeyes.exe. No manual file-by-file copying is needed.'
              'Leeyes.exe is intentionally not included or replaced. LeeyesW.exe is not included or used. A successful build does not prove runtime compatibility or that the archive listing issue is fixed.'
          ) | Set-Content -LiteralPath '.\Leeyes\BUILD-INFO.txt' -Encoding utf8

          @(
              'Leeyes Unicode Hack - Archive Diagnostics test instructions'
              ''
              'IMPORTANT: Double-clicking Leeyes.exe directly does not load the diagnostic DLL.'
              'LeeyesDiagLauncher.exe starts the EXISTING standard Leeyes.exe under DEBUG_ONLY_THIS_PROCESS, waits for the initial system breakpoint, then calls ntdll.dll LdrLoadDll and LdrGetProcedureAddress in the target process to load and initialize inject_dll.dll before the Leeyes EXE entry point.'
              'The running application process is Leeyes.exe. LeeyesW.exe is NOT included and must NOT be used.'
              ''
              '1. Close every running Leeyes.exe and LeeyesDiagLauncher.exe process.'
              '2. Extract ALL files from this ZIP directly into the existing Leeyes folder that contains your original Leeyes.exe. Allow replacement of inject_dll.dll and inject_dll.ini if prompted; Leeyes.exe is not in this ZIP and will not be replaced.'
              '3. Double-click LeeyesDiagLauncher.exe from that same folder. Wait for the normal Leeyes.exe window to appear.'
              '4. Reproduce the archive-listing failure using the specified ZIP.'
              '5. Close Leeyes normally. Send back _injector_debug.txt and _path_debug.txt from the Leeyes folder.'
              '6. The injector log now records the exact stage, exception message, remote LdrLoadDll/LdrGetProcedureAddress NTSTATUS values, loaded module address, initializer export address, and initializer completion. If a runtime error occurs, do not repeatedly retry.'
              ''
              'Do not replace or modify Leeyes.exe. Do not launch any LeeyesW.exe left over from an older test.'
          ) | Set-Content -LiteralPath '.\Leeyes\TEST-INSTRUCTIONS.txt' -Encoding utf8

          $hashes = Get-ChildItem -LiteralPath '.\Leeyes' -File |
              Where-Object { $_.Name -in @('inject_dll.dll', 'LeeyesDiagLauncher.exe', 'inject_dll.ini', 'BUILD-INFO.txt', 'TEST-INSTRUCTIONS.txt') } |
              Sort-Object Name |
              ForEach-Object {
                  $h = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
                  "$($h.Hash.ToLower()) $($_.Name)"
              }
          $hashes | Set-Content -LiteralPath '.\Leeyes\SHA256SUMS.txt' -Encoding ascii

          Compress-Archive -Path '.\Leeyes\inject_dll.dll', '.\Leeyes\LeeyesDiagLauncher.exe', '.\Leeyes\inject_dll.ini', '.\Leeyes\BUILD-INFO.txt', '.\Leeyes\TEST-INSTRUCTIONS.txt', '.\Leeyes\SHA256SUMS.txt' -DestinationPath '.\dist\LeeyesUnicodeHack_ArchiveDiagnostics_20261103_v8.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeyesUnicodeHack-ArchiveDiagnostics-20261103-v8
          path: dist/LeeyesUnicodeHack_ArchiveDiagnostics_20261103_v8.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LeeyesUnicodeHack-build-logs
          path: |
            **/*.log
            **/MSBuild*.binlog
          if-no-files-found: ignore
          retention-days: 7
